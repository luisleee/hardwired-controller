name: Build FPGA Bitstream

# Image source: https://github.com/raetro/sdk-docker-fpga
# Quartus Prime Lite 21.1 with MAX10 device support is pre-installed.
# License: Quartus tools are subject to Intel's FPGA Program License
#          Subscription Agreement (free for Lite edition).

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  synthesis:
    runs-on: ubuntu-latest
    container: raetro/quartus:21.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run compilation flow
        run: |
          quartus_sh --flow compile fpga/project.qpf 2>&1 | tee quartus_build.log
          echo ""
          echo "── Logic utilisation ──"
          grep -A 6 "Logic utilization" fpga/output_files/project.fit.rpt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitstream-${{ github.sha }}
          retention-days: 30
          path: |
            fpga/output_files/*.sof
            fpga/output_files/*.pof
            fpga/output_files/*.map.rpt
            fpga/output_files/*.fit.rpt
            fpga/output_files/*.sta.rpt
            quartus_build.log
