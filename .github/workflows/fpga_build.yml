name: Build FPGA Bitstream

# Image source: https://github.com/raetro/sdk-docker-fpga
# Using "docker run" instead of "container:" because the old glibc inside
# raetro/quartus:21.1 is incompatible with Node.js 20 (actions runner).

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  synthesis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cache the Docker image as a tar so subsequent runs skip the Hub pull.
      # First run: pull (~5-8 GB) + save → cache. Later runs: load from cache.
      - name: Cache Quartus Docker image
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/quartus-docker.tar
          key: docker-raetro-quartus-21.1

      - name: Pull and save image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker pull raetro/quartus:21.1
          docker save raetro/quartus:21.1 -o /tmp/quartus-docker.tar

      - name: Load image from cache
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/quartus-docker.tar

      - name: Run compilation flow
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            raetro/quartus:21.1 \
            quartus_sh --flow compile fpga/project.qpf

      - name: Show utilisation summary
        if: always()
        run: grep -A 6 "Logic utilization" fpga/output_files/project.fit.rpt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitstream-${{ github.sha }}
          retention-days: 30
          path: |
            fpga/output_files/*.sof
            fpga/output_files/*.pof
            fpga/output_files/*.map.rpt
            fpga/output_files/*.fit.rpt
            fpga/output_files/*.sta.rpt
