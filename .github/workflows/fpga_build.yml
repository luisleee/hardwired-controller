name: Build FPGA Bitstream

# Pull a prebuilt Quartus 13.0 + MAX7000 image from GHCR and use it for
# synthesis. Publish that image from the sibling repo ../quartus13-max7000.
# Update the image name below after you create/publish that repo.

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  synthesis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run compilation flow
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            ghcr.io/luisleee/quartus13-max7000:latest \
            bash -lc '
              set -e
              quartus_sh --flow compile fpga/project.qpf

              if [ -f fpga/output_files/project.pof ]; then
                quartus_cpf -c fpga/output_files/project.pof fpga/output_files/project.svf
              elif [ -f fpga/output_files/project.sof ]; then
                quartus_cpf -c fpga/output_files/project.sof fpga/output_files/project.svf
              else
                echo "No .pof or .sof found to convert into .svf" >&2
                exit 1
              fi
            '

      - name: Show utilisation summary
        if: always()
        run: grep -A 6 "Logic utilization" fpga/output_files/project.fit.rpt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitstream-${{ github.sha }}
          retention-days: 30
          path: |
            fpga/output_files/*.sof
            fpga/output_files/*.pof
            fpga/output_files/*.svf
            fpga/output_files/*.map.rpt
            fpga/output_files/*.fit.rpt
            fpga/output_files/*.sta.rpt
