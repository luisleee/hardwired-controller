name: Build FPGA Bitstream

# Build a Quartus 13.0 image with MAX7000 support, then use it for synthesis.
# The Dockerfile fetches the installer from Intel CDN and adds the repo-local
# MAX support qdz.

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  synthesis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Quartus image with MAX7000 support
        run: |
          docker build \
            -t local/quartus13-max7000:latest \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg BUILD_VERSION="13.0-max7000" \
            docker/quartus13-max7000

      - name: Run compilation flow
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            local/quartus13-max7000:latest \
            quartus_sh --flow compile fpga/project.qpf

      - name: Show utilisation summary
        if: always()
        run: grep -A 6 "Logic utilization" fpga/output_files/project.fit.rpt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitstream-${{ github.sha }}
          retention-days: 30
          path: |
            fpga/output_files/*.sof
            fpga/output_files/*.pof
            fpga/output_files/*.map.rpt
            fpga/output_files/*.fit.rpt
            fpga/output_files/*.sta.rpt
