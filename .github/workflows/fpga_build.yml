name: Build FPGA Bitstream

# Quartus image is pulled from GHCR (GitHub's own CDN, same datacenter as
# the runner) — no save/load cache needed.
# MAX7000/EPM7128 support ends at Quartus 13.1, so CI uses that image.
# Image source: https://github.com/raetro/sdk-docker-fpga

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  synthesis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run compilation flow
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            ghcr.io/raetro/quartus:13.1 \
            quartus_sh --flow compile fpga/project.qpf

      - name: Show utilisation summary
        if: always()
        run: grep -A 6 "Logic utilization" fpga/output_files/project.fit.rpt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitstream-${{ github.sha }}
          retention-days: 30
          path: |
            fpga/output_files/*.sof
            fpga/output_files/*.pof
            fpga/output_files/*.map.rpt
            fpga/output_files/*.fit.rpt
            fpga/output_files/*.sta.rpt
