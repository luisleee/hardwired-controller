name: Build FPGA Bitstream

# raetro/quartus:21.1 is based on old Ubuntu (glibc 2.23).
# GitHub Actions Node.js 20 runner requires glibc 2.27, so using
# "container:" breaks checkout/upload.  Fix: run on the standard
# ubuntu-latest host and invoke Quartus via "docker run" instead.
# Image source: https://github.com/raetro/sdk-docker-fpga

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  synthesis:
    runs-on: ubuntu-latest

    steps:
      # Node.js 20 actions run fine on the host (modern glibc).
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run compilation flow
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            raetro/quartus:21.1 \
            quartus_sh --flow compile fpga/project.qpf

      - name: Show utilisation summary
        if: always()
        run: |
          grep -A 6 "Logic utilization" \
            fpga/output_files/project.fit.rpt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitstream-${{ github.sha }}
          retention-days: 30
          path: |
            fpga/output_files/*.sof
            fpga/output_files/*.pof
            fpga/output_files/*.map.rpt
            fpga/output_files/*.fit.rpt
            fpga/output_files/*.sta.rpt
